[package]
name = "p99-logger-client"
version = "0.1.0"
edition = "2021"
description = "Headless Project 1999 and Project Quarm chat logger"
repository = "https://github.com/rm-you/p99-logger-client"
license = "MIT"

[[bin]]
name = "p99-logger-client"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
zeroize = { version = "1", features = ["serde"] }
eq-network = { git = "https://github.com/eq-p99-tools/eq-network", rev = "47b8c7e4b0f67ccae467f76f51ac28733ba6927c", version = "0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
