[package]
name = "p99-logger-client"
version = "0.1.0"
edition = "2021"
description = "Headless Project 1999 and Project Quarm chat logger"
repository = "https://github.com/rm-you/p99-logger-client"
license = "MIT"

[features]
default = ["cli"]
cli = ["dep:signal-hook"]

[[bin]]
name = "p99-logger-client"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crc32fast = "1"
hex = "0.4"
md5 = "0.7"
miniz_oxide = "0.8"
num-bigint = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.3", optional = true }
eq-login-protocol = { package = "protocol", git = "https://github.com/eq-p99-tools/p99-login-proxy", tag = "v2.0.0-rc9" }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
